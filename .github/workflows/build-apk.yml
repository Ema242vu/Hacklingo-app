name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob

      - name: Build Web App
        run: npm run build

      - name: Init Capacitor
        run: npx cap init HackLingo com.hacklingo.app --web-dir=dist

      - name: Remove old Android folder
        run: rm -rf android

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      - name: Add Android Platform
        run: npx cap add android

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Add AdMob App ID to AndroidManifest
        run: |
          cd android/app/src/main
          sed -i '/<application/i \        <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="ca-app-pub-5959908767381687~7506133039"/>' AndroidManifest.xml
          cd -

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackLingo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
