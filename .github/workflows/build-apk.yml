name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob

      - name: Build Web App
        run: npm run build

      - name: Init Capacitor (no sobrescribe si existe)
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init HackLingo com.hacklingo.app --web-dir=dist
          fi

      - name: Remove old Android folder
        run: rm -rf android

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      - name: Add Android Platform
        run: npx cap add android

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Inject AdMob App ID into AndroidManifest
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          app_id = "ca-app-pub-5959908767381687~7506133039"
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              meta = ('        <meta-data\n'
                      '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
                      f'            android:value="{app_id}"/>\n')
              s = s.replace("<application", meta + "    <application", 1)
              p.write_text(s)
              print("AdMob App ID inyectado correctamente")
          else:
              print("AdMob App ID ya estaba presente")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackLingo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
